<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crea password — UI/UX Pro Max</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="header"><h1>UI/UX Pro Max</h1></div>
<div class="main">
  <div class="card">
    <h2>Crea la tua password</h2>
    <div class="sub">Solo per il primo accesso. La tua email deve essere già stata abilitata dall'amministratore.</div>

    <form id="form-registra">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">

      <label for="password">Nuova password</label>
      <input type="password" id="password" required minlength="8" autocomplete="new-password">

      <label for="password2">Conferma password</label>
      <input type="password" id="password2" required minlength="8" autocomplete="new-password">

      <button type="submit" id="btn-registra">Crea password</button>
    </form>

    <div class="msg-errore" id="msg-errore"></div>
    <div class="msg-ok" id="msg-ok"></div>

    <div class="link-riga">
      Hai già una password? <a href="index.html">Vai al login</a>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  const form = document.getElementById("form-registra");
  const msgErrore = document.getElementById("msg-errore");
  const msgOk = document.getElementById("msg-ok");
  const btn = document.getElementById("btn-registra");

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    msgErrore.style.display = "none";
    msgOk.style.display = "none";

    const password = document.getElementById("password").value;
    const password2 = document.getElementById("password2").value;
    if (password !== password2) {
      msgErrore.textContent = "Le due password non coincidono.";
      msgErrore.style.display = "block";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Creazione in corso...";

    try {
      const email = document.getElementById("email").value.trim();
      const risposta = await chiamaAppsScript("register", { email, password });

      if (!risposta.ok) {
        msgErrore.textContent = risposta.errore || "Creazione non riuscita.";
        msgErrore.style.display = "block";
        return;
      }

      msgOk.textContent = "Password creata. Ora puoi accedere.";
      msgOk.style.display = "block";
      form.reset();
      setTimeout(() => { window.location.href = "index.html"; }, 1500);
    } catch (err) {
      msgErrore.textContent = err.message || "Errore imprevisto.";
      msgErrore.style.display = "block";
    } finally {
      btn.disabled = false;
      btn.textContent = "Crea password";
    }
  });
</script>
</body>
</html>
